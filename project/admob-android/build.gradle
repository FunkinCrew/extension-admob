apply plugin: 'com.android.library'

repositories
{
	mavenCentral()
	google()
}

tasks.withType(JavaCompile)
{
	options.compilerArgs << "-Xlint:deprecation"
}

android
{
	namespace 'org.haxe.extension.admob'
	compileSdkVersion Integer.parseInt(project.ANDROID_BUILD_SDK_VERSION)
	buildToolsVersion project.ANDROID_BUILD_TOOLS_VERSION
}

dependencies
{
	// Local project dependencies
	implementation project(':deps:extension-api')

	// Google Mobile Services (GMS) and User Messaging Platform (UMP)
	implementation('com.google.android.gms:play-services-ads:+')
	implementation('com.google.android.ump:user-messaging-platform:+')

	// Unity Ads SDK and Mediation Adapter
	implementation('com.unity3d.ads:unity-ads:4.19.0')
	implementation('com.google.ads.mediation:unity:4.19.0.0')

	// Pangle Mediation Adapter
	implementation('com.google.ads.mediation:pangle:8.1.0.5.0')

	// Vungle Mediation Adapter
	implementation('com.google.ads.mediation:vungle:7.7.4.2')

	// AppLovin Mediation Adapter
	implementation("com.google.ads.mediation:applovin:13.6.1.0")

	// InMobi Mediation Adapter
	implementation("com.google.ads.mediation:inmobi:11.3.0.0")
}
